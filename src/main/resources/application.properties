spring.application.name=VeritasPath

# H2 file-based database so comparison history survives a restart
spring.datasource.url=jdbc:h2:file:./data/veritaspath;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disabled by default (it's raw SQL access with no auth) -- for local inspection,
# run with: mvn spring-boot:run -Dspring-boot.run.arguments=--spring.h2.console.enabled=true
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

server.port=${PORT:8080}
